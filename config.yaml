# ---- paths ----
paths:
  train_dir: dataset/train
  test_dir: dataset/test
  train_sources: [train_source1.tsv, train_source2.tsv, train_source3.tsv]
  test_sources: [test_source1.tsv, test_source2.tsv, test_source3.tsv]
  output_dir: output
  cache_dir: cache
  model_path: cache/model.pkl
  normalize_chunk_size: 100000   # rows/chunk during normalize -- bounds peak memory

# ---- blocking ----
blocking:
  rare_token_df_min: 2          # inverted index: only index tokens with df >= this
  rare_token_df_max: 200        # ... and <= this (drop ultra-common tokens)
  char_ngram_n: 3
  minhash_threshold: 0.5        # LSH Jaccard threshold
  addr_token_df_max: 300
  use_lsh: true                 # set false if datasketch is unavailable
  loc_token_df_max: 500         # caps cs:/nfirst:/nfirst2:/meta:/init:
  n_jobs: 2                     # CHANGED 4->2: extra safety margin now that the
                                 # actual OOM cause (pd.concat in pipeline.py) is
                                 # fixed. Try bumping back to 4 once a run at 2
                                 # completes comfortably under the RAM ceiling.
  chunk_size: 100000             # rows/chunk for the parallel scan/lookup passes

# ---- model ----
model:
  n_estimators: 900
  learning_rate: 0.03
  num_leaves: 63
  min_child_samples: 40
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 1.0
  n_folds: 3                    # GroupKFold by s1_id
  calibrate: true
  max_train_pairs: 3000000      # hard cap on total (S1,candidate) training pairs.
                                 # All S1 entities with a true match are always kept in full;
                                 # the budget is filled out with a random sample of singleton
                                 # (no-match) entities. Bounds build_training_pairs() and the
                                 # tune_thresholds() grid search regardless of how many
                                 # candidates/entity blocking actually produces on your data.

# ---- F0.5 decision ----
decision:
  t_open_grid: [0.30, 0.94, 0.02]   # start, stop (incl), step
  t_add_grid:  [0.20, 0.94, 0.02]
  greedy_per_entity: true
  max_matches: 0                    # 0 = unlimited; set 1..3 if EDA says many-to-one

team_name: myteam